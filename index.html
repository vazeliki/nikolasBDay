<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy 3rd Birthday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Comfortaa:wght@700&display=swap">
<style>
/* Layout: a flip card in a balloon sky. Front = wolf + big 3. Back = construction cake → gift, with dinos, rocket, fire truck and train always on the move. */
:root{
  --sky:#8fd8ff; --sky2:#d4f1ff; --paper:#fffdf7; --ink:#2a3360;
  --red:#ff5a5f; --orange:#ff9f1c; --yellow:#ffd23f; --green:#3ecf8e; --blue:#3a86ff; --purple:#9b5de5; --pink:#ff7eb6; --blush:#ffa3c0;
  --cy:#ffcc00; --cy-dark:#d9a400; --brick:#f7a14a; --brick-dark:#d9782a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--display);
  overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#balloons{position:fixed;inset:0;overflow:hidden;z-index:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scene{pointer-events:auto;width:min(430px,100%);perspective:1600px}
.card{display:grid;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.3,1.2)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-radius:28px;
  padding:18px 14px 18px;box-shadow:0 10px 0 rgba(42,51,96,.15),0 20px 40px rgba(42,51,96,.15);border:6px solid #fff;
  outline:3px dashed var(--yellow);outline-offset:-14px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;overflow:hidden}
.front{justify-content:space-evenly}
.back{transform:rotateY(180deg)}
.card:not(.flipped) .back, .card.flipped .front{pointer-events:none}
svg{overflow:visible}

/* front */
h1{margin:0;font-family:"Comfortaa","Arial Rounded MT Bold",sans-serif;font-weight:700;line-height:1.1;font-size:clamp(34px,10vw,50px);text-align:center;text-wrap:balance}
h1 .w{display:inline-block;white-space:nowrap;margin:0 .1em}
h1 .w.nm{font-size:1.2em}
h1 .l{display:inline-block;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.wolfbox{position:relative;width:min(280px,78%);cursor:pointer;touch-action:manipulation;margin-top:4px}
.wolfbox img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.wolf{transform-origin:50% 100%;animation:idle 1.1s ease-in-out infinite}
.wolf.jump{animation:jump .9s cubic-bezier(.3,.7,.4,1)}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97) translateY(2px)}}
@keyframes jump{0%{transform:scale(1.08,.9)}25%{transform:translateY(-70px) scale(.95,1.06) rotate(-8deg)}50%{transform:translateY(-90px) rotate(8deg)}80%{transform:translateY(0) scale(1.1,.88)}100%{transform:scale(1,1)}}
.hat{position:absolute;left:9%;top:-15%;width:26%;transform:rotate(-22deg);pointer-events:none}
.three{position:absolute;right:-4%;top:2%;width:30%;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;
  background:var(--orange);color:#fff;font-size:clamp(54px,16vw,78px);line-height:1;box-shadow:0 5px 0 #d97f00;animation:wobble 2.2s ease-in-out infinite}
.three span{-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:translateY(4%)}
@keyframes wobble{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.08)}}
.zz{position:absolute;pointer-events:none;font-size:26px;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-90px) scale(1.4)}}
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);box-shadow:0 6px 0 #c73a40;cursor:pointer;display:grid;place-items:center;animation:pulse 1.2s ease-in-out infinite;margin-top:8px}
.play svg{width:46px;height:46px;margin-left:6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.icons{display:flex;gap:14px;justify-content:center;margin-top:4px}
.ib{width:54px;height:54px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 0 rgba(42,51,96,.2);cursor:pointer;display:grid;place-items:center;font-size:26px;color:var(--ink)}
button:focus-visible,[role=button]:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.hand{position:absolute;left:0;top:0;font-size:46px;pointer-events:none;z-index:5;line-height:1;transition:left .4s,top .4s,opacity .3s;opacity:0;filter:drop-shadow(0 3px 0 rgba(42,51,96,.25))}
.hand span{display:block;animation:poke .7s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}

/* stage: cake ↔ gift */
.stage{position:relative;width:100%;max-width:350px;display:grid;padding-top:30px}
.stage > *{grid-area:1/1}
#cake{transition:opacity .6s,transform .6s}
#cake svg{display:block;width:100%;height:auto}
#cake.gone{opacity:0;transform:scale(.6) translateY(40px);pointer-events:none}
.vb{transform-box:view-box}
.arm{transform-origin:92px 106px;animation:dig 3s ease-in-out infinite}
.stick{transform-origin:74px 56px;animation:scoop 3s ease-in-out infinite}
@keyframes dig{0%,100%{transform:rotate(0)}40%{transform:rotate(-14deg)}70%{transform:rotate(8deg)}}
@keyframes scoop{0%,100%{transform:rotate(0)}40%{transform:rotate(18deg)}70%{transform:rotate(-12deg)}}
.hook{transform-origin:300px 50px;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.big3{transform-origin:175px 150px;animation:wob3 2.2s ease-in-out infinite}
@keyframes wob3{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.04)}}
.dump{animation:roll 4s ease-in-out infinite}
.bed{transform-origin:106px 254px;animation:tip 4s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1s linear infinite}
@keyframes roll{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes tip{0%,55%,100%{transform:rotate(0)}68%,82%{transform:rotate(-20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.candle{cursor:pointer;outline:none}
.candle:focus-visible rect{stroke:var(--blue);stroke-width:3}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
.out .flame{display:none}
.smoke{opacity:0}
.out .smoke{animation:smoke 1.2s ease-out forwards}
@keyframes flick{from{transform:scale(1,1) rotate(-5deg)}to{transform:scale(.88,1.12) rotate(5deg)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
#gift{width:78%;height:auto;margin:auto;cursor:pointer;outline:none;opacity:0;transform:scale(0) rotate(-20deg);pointer-events:none}
#gift.show{animation:arrive .9s cubic-bezier(.3,1.6,.5,1) forwards;pointer-events:auto}
#gift.show:not(.open) .boxall{animation:jiggle 1.3s ease-in-out .9s infinite;transform-box:fill-box;transform-origin:50% 100%}
#gift .lid{transition:transform .7s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:0% 100%}
#gift.open .lid{transform:translate(-14px,-58px) rotate(-22deg)}
#gift .sparks{opacity:0;transition:opacity .4s .2s}
#gift.open .sparks{opacity:1}
@keyframes arrive{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes jiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}85%{transform:rotate(7deg)}92%{transform:rotate(-3deg)}}

/* playground: dinos kicking a ball + rocket */
.play-row{width:100%;max-width:350px}
.play-row svg{display:block;width:100%;height:auto}
.dino,.ballg,.rocket{cursor:pointer}
.dbody{transform-box:fill-box;transform-origin:50% 100%;animation:walk .5s ease-in-out infinite alternate}
.d2 .dbody{animation-duration:.7s}
.legA{animation:step .5s ease-in-out infinite alternate}
.legB{animation:step .5s ease-in-out infinite alternate-reverse}
.d2 .legA,.d2 .legB{animation-duration:.7s}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .4s ease-in-out infinite alternate}
.d2 .tail{transform-origin:0% 50%}
.neck{transform-box:fill-box;transform-origin:70% 100%;animation:nod 1.4s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-3px) rotate(2deg)}}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes nod{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.dino.cheer .dbody{animation:dhop .6s cubic-bezier(.3,.7,.4,1) 2}
.dino.loop .dbody{animation:dhop .6s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes dhop{0%,100%{transform:translateY(0) scale(1.05,.92)}45%{transform:translateY(-24px) rotate(-6deg) scale(.96,1.05)}}
.bx{animation:bx 1.8s linear infinite alternate}
.by{animation:by .9s cubic-bezier(.3,.6,.6,1) infinite alternate}
.bspin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.2s linear infinite}
@keyframes bx{from{transform:translateX(0)}to{transform:translateX(112px)}}
@keyframes by{from{transform:translateY(0)}to{transform:translateY(-58px)}}
.ballg.go .by{animation:by .3s cubic-bezier(.3,.6,.6,1) infinite alternate}
.hover{animation:hover 1.2s ease-in-out infinite alternate}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.rflame{transform-box:fill-box;transform-origin:50% 0;animation:flick .12s infinite alternate}
.rocket.go .hover{animation:launch 2s cubic-bezier(.5,0,.5,1)}
@keyframes launch{0%{transform:translateY(0)}45%{transform:translateY(-420px)}46%{transform:translateY(-420px);opacity:0}47%{transform:translateY(120px);opacity:0}48%{opacity:1}100%{transform:translateY(0)}}

/* lane: train + fire truck */
.lane{position:relative;width:100%;height:118px;overflow:hidden}
.lane .rail{position:absolute;left:0;right:0;bottom:44px;height:6px;background:repeating-linear-gradient(90deg,#a0714f 0 8px,transparent 8px 22px),linear-gradient(#7d8597,#7d8597) 0 0/100% 3px no-repeat}
.lane .road{position:absolute;left:0;right:0;bottom:0;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 30px) 0 50%/100% 3px no-repeat,#9aa3b5}
.train{position:absolute;bottom:48px;left:-300px;width:260px;height:auto;cursor:pointer;animation:chug 11s linear infinite;animation-delay:-5s}
.car{animation:rattle .3s ease-in-out infinite alternate}
.puff{opacity:0;animation:smokepuff 1.2s ease-out infinite}
.puff:nth-of-type(2){animation-delay:.4s}.puff:nth-of-type(3){animation-delay:.8s}
.train.toot .puff{animation-duration:.5s}
@keyframes chug{from{left:-300px}to{left:100%}}
@keyframes rattle{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes smokepuff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-14px,-30px) scale(1.7)}}
.ftruck{position:absolute;bottom:6px;left:100%;width:104px;height:auto;cursor:pointer;animation:drive 6.5s linear infinite;animation-delay:-2s}
.ftruck .siren{animation:siren .5s steps(1) infinite}
.ftruck.go .siren{animation-duration:.2s}
@keyframes drive{from{left:100%}to{left:-120px}}
@keyframes siren{0%{fill:var(--red)}50%{fill:var(--blue)}}

.back.party .dbody{animation:dhop .6s cubic-bezier(.3,.7,.4,1) infinite}
.back.party .train{animation-duration:5s}

/* balloons */
.balloon{position:absolute;left:0;top:0;width:60px;height:120px;border:0;padding:0;background:transparent;cursor:pointer;touch-action:manipulation}
.balloon i{display:block;position:relative;width:60px;height:72px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 6px,transparent 7px),var(--c)}
.balloon i::after{content:"";position:absolute;left:25px;top:68px;border:5px solid transparent;border-bottom-color:var(--c)}
.balloon::after{content:"";position:absolute;left:29px;top:78px;width:2px;height:42px;background:rgba(42,51,96,.3)}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}.train{left:10%}.ftruck{left:55%}}
</style>

<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const cols=['--red','--orange','--yellow','--green','--blue','--purple','--pink'];
  let li=0;
  ['Χρόνια','πολλά,','Νικόλα'].forEach((word,wi)=>{
    if(wi===2) $('title').appendChild(document.createElement('br'));
    const w=document.createElement('span'); w.className= wi===2?'w nm':'w';
    [...word].forEach(ch=>{ const s=document.createElement('span'); s.className='l'; s.setAttribute('aria-hidden','true');
      s.textContent=ch; s.style.color=`var(${cols[li%cols.length]})`; s.style.animationDelay=(li*.08)+'s'; li++; w.appendChild(s); });
    $('title').appendChild(w);
  });
  const onTap=(el,fn)=>{ el.addEventListener('click',e=>{e.stopPropagation();fn(e);}); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e);} }); };
  function replay(el,cls,ms){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove(cls),ms); }
  const at=el=>{ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/3]; };

  // ---------- sound ----------
  let ac=null;
  const audio=()=>{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; };
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function osc(type,t,dur,vol,setF,dest){ const a=audio(), o=a.createOscillator(), g=a.createGain(); o.type=type; setF(o.frequency,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest||a.destination); o.start(t); o.stop(t+dur+.05); return o; }
  function bell(m,t,dur=.9,vol=.25){ const a=audio(); t=t??a.currentTime;
    osc('triangle',t,dur,vol,f=>f.value=hz(m)); osc('sine',t,.22,vol*.3,f=>f.value=hz(m)*4); }
  function noise(len,shape,type,freq,vol,sweep){ const a=audio(), t=a.currentTime, n=Math.floor(len*a.sampleRate), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*shape(i/n);
    const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(sweep) sweep(f.frequency,t);
    const g=a.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }
  const pop=()=>noise(.09,x=>Math.pow(1-x,3),'bandpass',1400,.9);
  const puff=()=>noise(.4,x=>Math.sin(Math.PI*x)*.6,'lowpass',800,1);
  const whoosh=()=>noise(1.6,x=>Math.sin(Math.PI*x),'bandpass',300,.9,(f,t)=>{f.setValueAtTime(200,t);f.exponentialRampToValueAtTime(3500,t+.8);f.exponentialRampToValueAtTime(300,t+1.6);});
  function fanfare(){ const t=audio().currentTime; [72,76,79,84].forEach((m,i)=>bell(m,t+i*.12,.8,.22)); bell(88,t+.5,1.4,.22); }
  function howl(){ const a=audio(), t=a.currentTime, b=480+Math.random()*120, f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500; f.Q.value=4; f.connect(a.destination);
    const o=osc('sawtooth',t,1.2,.16,(fr,t)=>{fr.setValueAtTime(b*.7,t);fr.exponentialRampToValueAtTime(b*1.35,t+.25);fr.exponentialRampToValueAtTime(b*1.2,t+.8);fr.exponentialRampToValueAtTime(b*.8,t+1.15);},f);
    const l=a.createOscillator(), ld=a.createGain(); l.frequency.value=7; ld.gain.value=14; l.connect(ld); ld.connect(o.frequency); l.start(t); l.stop(t+1.25); }
  function siren(){ const a=audio(), t=a.currentTime, f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800; f.connect(a.destination);
    osc('square',t,1.9,.07,fr=>{ for(let i=0;i<6;i++) fr.setValueAtTime(i%2?740:980,t+i*.3); },f); }
  function boing(){ const a=audio(); [0,.3,.55].forEach((dt,i)=>{ const t=a.currentTime+dt;
    osc('sine',t,.3,.25/(i+1),fr=>{fr.setValueAtTime(140,t);fr.exponentialRampToValueAtTime(520-i*80,t+.12);fr.exponentialRampToValueAtTime(220,t+.3);}); }); }
  function toot(){ const a=audio(); [0,.45].forEach(dt=>{ const t=a.currentTime+dt; [587,740,880].forEach(fq=>osc('triangle',t,.42,.08,fr=>fr.value=fq)); }); }
  function roar(){ const a=audio(), t=a.currentTime, f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.connect(a.destination);
    const o=osc('sawtooth',t,.75,.2,fr=>{fr.setValueAtTime(260,t);fr.exponentialRampToValueAtTime(150,t+.25);fr.exponentialRampToValueAtTime(90,t+.7);},f);
    const l=a.createOscillator(), ld=a.createGain(); l.frequency.value=28; ld.gain.value=25; l.connect(ld); ld.connect(o.frequency); l.start(t); l.stop(t+.8); }
  function clank(){ const t=audio().currentTime; [0,.18].forEach(dt=>{ osc('square',t+dt,.12,.06,fr=>fr.value=180); noise(.06,x=>1-x,'highpass',2000,.4); }); }

  const song=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
              [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2.5]];
  const chords={0:[48,55],6:[43,50],12:[48,55],19:[53,57],23:[48,55]};
  let songEnd=0;
  function playSong(){ const a=audio(); if(a.currentTime<songEnd) return; const beat=.42; let t=a.currentTime+.15;
    song.forEach(([m,d],i)=>{ bell(m+12,t,Math.max(.5,d*beat*1.4),.2); bell(m,t,Math.max(.5,d*beat*1.4),.1); if(chords[i]) chords[i].forEach(c=>bell(c,t,2.4,.07)); t+=d*beat; });
    songEnd=t; }

  // ---------- front ----------
  const w1=$('wolf1'), wb=$('wolfFront');
  onTap(wb,()=>{ w1.className='wolf'; void w1.offsetWidth; w1.className='wolf jump'; setTimeout(()=>w1.className='wolf',900); howl();
    const [x,y]=at(wb); burst(x,y,18);
    ['🎵','⭐','🎶'].forEach((e,i)=>{ const z=document.createElement('span'); z.className='zz'; z.textContent=e; z.style.left=(20+i*25)+'%'; z.style.top='-6%'; z.style.animationDelay=(i*.12)+'s'; wb.appendChild(z); setTimeout(()=>z.remove(),1500); }); });
  const card=$('card'), back=$('back'), hand=$('hand');
  $('open').addEventListener('click',()=>{ card.classList.add('flipped'); playSong(); burst(innerWidth/2,innerHeight/3,60); setTimeout(pointNext,950); });
  $('sing').addEventListener('click',()=>{ songEnd=0; playSong(); });

  // ---------- toys ----------
  document.querySelectorAll('.dino').forEach(d=>onTap(d,()=>{ roar(); cheerDinos(); const [x,y]=at(d); burst(x,y,14); }));
  function cheerDinos(){ document.querySelectorAll('.dino').forEach((d,i)=>{ if(d.classList.contains('loop')) return; setTimeout(()=>replay(d,'cheer',1300),i*120); }); }
  const ballg=document.querySelector('.ballg'); onTap(ballg,()=>{ boing(); replay(ballg,'go',1400); });
  const rocket=document.querySelector('.rocket'); onTap(rocket,()=>{ if(rocket.classList.contains('go')) return; whoosh(); replay(rocket,'go',2000); const [x,y]=at(rocket); burst(x,y+30,16); });
  const train=$('train'); onTap(train,()=>{ toot(); replay(train,'toot',1500); });
  const ft=$('ftruck'); onTap(ft,()=>{ siren(); replay(ft,'go',1900); });
  ['excavator','crane','dump'].forEach(id=>{ const el=$(id); if(el) onTap(el,()=>{ clank(); const [x,y]=at(el); burst(x,y,12); }); });

  // ---------- pointing hand ----------
  const candles=[...document.querySelectorAll('.candle')], cake=$('cake'), gift=$('gift');
  function pointAt(el,dy){ if(!el){ hand.style.opacity=0; return; }
    const br=back.getBoundingClientRect(), r=el.getBoundingClientRect();
    hand.style.left=(r.left-br.left+r.width/2-23)+'px'; hand.style.top=(r.top-br.top+dy)+'px'; hand.style.opacity=1; }
  function pointNext(){ if(!card.classList.contains('flipped')) return;
    const c=candles.find(x=>!x.classList.contains('out'));
    if(c) pointAt(c.querySelector('.flame'),-58);
    else if(gift.classList.contains('show')&&!gift.classList.contains('open')) pointAt(gift.querySelector('.lid'),-40);
    else pointAt(null); }
  addEventListener('resize',pointNext);

  // ---------- candles → gift ----------
  function blow(c){ if(c.classList.contains('out')) return;
    c.classList.add('out'); puff(); const r=c.getBoundingClientRect(); burst(r.left+r.width/2,r.top+20,22);
    const left=candles.filter(x=>!x.classList.contains('out')).length; bell([84,79,76][left]||84); cheerDinos(); pointNext();
    if(!left){ pointAt(null); setTimeout(showGift,1300); } }
  candles.forEach(c=>onTap(c,()=>blow(c)));
  function showGift(){ cake.classList.add('gone'); gift.classList.add('show'); gift.tabIndex=0; fanfare(); howl(); burst(innerWidth/2,innerHeight/2,80); cheerDinos(); setTimeout(pointNext,1000); }
  const voice=$('voice');
  function openGift(){ if(!gift.classList.contains('show')||gift.classList.contains('open')) return;
    gift.classList.add('open'); pointAt(null); fanfare(); back.classList.add('party');
    document.querySelectorAll('.dino').forEach(d=>d.classList.add('loop'));
    const [x,y]=at(gift); for(let k=0;k<5;k++) setTimeout(()=>burst(x,y,120),k*350);
    let wait=1400;
    if(voice){ try{ voice.currentTime=0; const p=voice.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} wait=Math.max(1400,((voice.duration||4)+.6)*1000); }
    else setTimeout(howl,500);
    setTimeout(()=>{ songEnd=0; playSong(); },wait); }
  onTap(gift,openGift);
  $('restart').addEventListener('click',()=>{ candles.forEach(c=>c.classList.remove('out')); cake.classList.remove('gone');
    gift.classList.remove('show','open'); gift.tabIndex=-1; back.classList.remove('party');
    document.querySelectorAll('.dino').forEach(d=>d.classList.remove('loop','cheer')); if(voice){ voice.pause(); }
    pointAt(null); card.classList.remove('flipped'); });

  // ---------- balloons ----------
  const layer=$('balloons'), notes=[72,74,76,77,79,81,83,84], balloons=[];
  function place(b,initial){ b.x=Math.random()*(innerWidth-60); b.y=initial?Math.random()*innerHeight:innerHeight+40+Math.random()*200;
    b.v=25+Math.random()*30; b.ph=Math.random()*6.28; b.amp=10+Math.random()*25;
    b.el.style.setProperty('--c',`var(${cols[Math.floor(Math.random()*cols.length)]})`); b.el.hidden=false; b.gone=false; }
  const count=Math.max(9,Math.min(16,Math.round(innerWidth/70)));
  for(let i=0;i<count;i++){ const el=document.createElement('button'); el.type='button'; el.className='balloon'; el.setAttribute('aria-label','Pop balloon'); el.innerHTML='<i></i>';
    const b={el}; el.addEventListener('pointerdown',e=>{e.preventDefault();popB(b);}); layer.appendChild(el); balloons.push(b); place(b,true); }
  function popB(b){ if(b.gone) return; b.gone=true; const r=b.el.getBoundingClientRect(); pop(); bell(notes[Math.floor(Math.random()*8)],audio().currentTime+.03,.7,.18);
    burst(r.left+30,r.top+36,30,getComputedStyle(b.el).getPropertyValue('--c')); b.el.hidden=true; setTimeout(()=>place(b,false),1200); }
  let last=performance.now();
  (function drift(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
    balloons.forEach(b=>{ if(b.gone) return; if(!reduce){ b.y-=b.v*dt; b.ph+=dt*1.2; } if(b.y<-140) place(b,false);
      const s=reduce?0:Math.sin(b.ph)*b.amp; b.el.style.transform=`translate(${b.x+s}px,${b.y}px) rotate(${s*.3}deg)`; });
    requestAnimationFrame(drift); })(last);

  // ---------- confetti ----------
  const cv=$('confetti'), cx=cv.getContext('2d'); let parts=[], running=false;
  const rs=()=>{ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0); }; addEventListener('resize',rs); rs();
  const pal=['#ff5a5f','#ff9f1c','#ffd23f','#3ecf8e','#3a86ff','#9b5de5','#ff7eb6'];
  function burst(x,y,n,col){ if(reduce) n=Math.min(n,20);
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=3+Math.random()*8;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*4,c:(col&&Math.random()<.5)?col.trim():pal[i%pal.length],life:1}); }
    if(!running){ running=true; requestAnimationFrame(tick); } }
  function tick(){ cx.clearRect(0,0,innerWidth,innerHeight); parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);
    parts.forEach(p=>{ p.vy+=.2; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.005;
      cx.save(); cx.globalAlpha=Math.max(0,Math.min(1,p.life*2)); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
    if(parts.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,innerWidth,innerHeight); } }
})();
</script>

</body>
</html>
